    /* Squarish 4:3-ish screens (classic iPad landscape, old tablets/monitors,
       resized windows) sit in an awkward gap: often ≥1024px wide so they'd
       otherwise get the full desktop two-column layout, but with much less
       vertical room to show it in. This keeps the two-column layout (it's
       still wide enough to earn it) but tightens everything vertically so
       more content fits without excess scrolling, and narrows the sidebar
       a bit since the main column has less width to spare than on a real
       desktop monitor. Range covers ~4:3 up to ~5:4 so it isn't limited to
       one exact ratio. */
    @media (min-aspect-ratio: 5/4) and (max-aspect-ratio: 4/3) and (min-width: 700px) {
      .profile-favorites .section-heading,
      .profile-stats-embed .section-heading {

        clear: left;
        width: calc(100% - 300px);

  <script>
    // Paste your free TMDB API key (v3 auth) here to turn on the "Last Watch" trailer.
    // Get one at https://www.themoviedb.org/settings/api — leave blank to just show the poster.
    window.TMDB_API_KEY = "6cb6e1dc603bc65ffb6198489d5bc5b7";

  <script>
    (function () {
      function starGlyph(v) {
        var full = Math.floor(v);
        var half = (v - full) >= 0.5;
        return '\u2605'.repeat(full) + (half ? '\u00BD' : '');
      }

      var section = document.getElementById('last-watched-section');
      var linkEl = document.getElementById('last-watched-link');
      var imgEl = document.getElementById('last-watched-img');
      var ratingEl = document.getElementById('last-watched-rating');
      if (!section || !linkEl || !imgEl) return;

      var journaled = SHOWS.filter(function (s) { return !!s.journalYear; });
      if (!journaled.length) return;

      var currentYear = new Date().getFullYear();
      var thisYear = journaled.filter(function (s) { return s.journalYear === currentYear; });
      var pool = thisYear.length ? thisYear : journaled;

      var lastWatched = pool.reduce(function (latest, s) {
        return (!latest || s.journalOrder > latest.journalOrder) ? s : latest;
      }, null);

      if (!lastWatched) return;

      linkEl.href = '/show/?imdb=' + lastWatched.imdb;
      imgEl.src = lastWatched.src;
      imgEl.alt = lastWatched.title || '';

      if (ratingEl && lastWatched.rating != null) {
        ratingEl.innerHTML = '<a href="/u/saif/rating/?stars=' + lastWatched.rating + '" class="rating-link">' + starGlyph(lastWatched.rating) + '</a>';
      }

      section.hidden = false;

      // --- Trailer: fetched from TMDB, swapped in exactly 3.5s after the page opens ---
      var TMDB_API_KEY = window.TMDB_API_KEY || '';
      var mediaEl = document.getElementById('last-watched-media');
      var trailerEl = document.getElementById('last-watched-trailer');
      var reverted = true; // becomes false once a trailer actually starts playing
      var autoRevertTimer = null;

      function loadYouTubeAPI(callback) {
        if (window.YT && window.YT.Player) { callback(); return; }
        var existing = window.onYouTubeIframeAPIReady;
        window.onYouTubeIframeAPIReady = function () {
          if (existing) existing();
          callback();
        };
        if (!document.getElementById('youtube-iframe-api')) {
          var tag = document.createElement('script');
          tag.id = 'youtube-iframe-api';
          tag.src = 'https://www.youtube.com/iframe_api';
          document.head.appendChild(tag);
        }
      }

      function revertToPoster() {
        if (reverted) return;
        reverted = true;
        if (autoRevertTimer) { clearTimeout(autoRevertTimer); autoRevertTimer = null; }
        // Hide the iframe immediately (no transition) so YouTube's own end-of-video
        // "more videos" screen never has a chance to flash before we fade to the poster.
        trailerEl.style.transition = 'none';
        trailerEl.style.opacity = '0';
        mediaEl.classList.remove('-trailer-active');
        section.classList.remove('-trailer-active');
        var labelEl = document.getElementById('last-watched-label');
        if (labelEl) labelEl.textContent = 'Last Watch';
        // wait a beat before actually removing the player and resetting the inline styles
        setTimeout(function () {
          trailerEl.innerHTML = '';
          trailerEl.style.transition = '';
          trailerEl.style.opacity = '';
        }, 900);
      }

      function playTrailer(key) {
        if (!mediaEl || !trailerEl || !key) return;
        reverted = false;
        var hasStartedRevertTimer = false;
        var iframe = document.createElement('iframe');
        iframe.id = 'last-watched-trailer-iframe';
        iframe.src = 'https://www.youtube.com/embed/' + key +
          '?autoplay=1&mute=1&controls=0&rel=0&modestbranding=1&showinfo=0&playsinline=1' +
          '&disablekb=1&iv_load_policy=3&cc_load_policy=0&fs=0&enablejsapi=1&origin=' + window.location.origin;
        iframe.title = 'Trailer';
        // No "picture-in-picture" here on purpose: granting that permission is what lets
        // mobile browsers auto-pop the video into a little floating window on their own.
        iframe.allow = 'autoplay; encrypted-media';
        iframe.referrerPolicy = 'strict-origin-when-cross-origin';
        iframe.frameBorder = '0';
        iframe.tabIndex = -1;
        trailerEl.appendChild(iframe);

        // Click-to-toggle play/pause overlay (no link, no navigating to YouTube).
        var toggleBtn = document.createElement('button');
        toggleBtn.type = 'button';
        toggleBtn.className = 'last-watched-trailer-toggle';
        toggleBtn.setAttribute('aria-label', 'Play or pause trailer');
        toggleBtn.innerHTML =
          '<span class="icon">' +
            '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>' +
          '</span>';
        trailerEl.appendChild(toggleBtn);

        // "Tap to unmute" pill - shown on both mobile and desktop while muted.
        var unmuteHint = document.createElement('button');
        unmuteHint.type = 'button';
        unmuteHint.className = 'last-watched-trailer-unmute';
        unmuteHint.setAttribute('aria-label', 'Tap to unmute trailer');
        unmuteHint.innerHTML =
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.8L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>' +
          '<span>Tap to unmute</span>';
        trailerEl.appendChild(unmuteHint);

        var player = null;
        var wantsUnmute = false;

        function applyUnmuteIfWanted() {
          if (!wantsUnmute || !player || typeof player.unMute !== 'function') return;
          try { player.unMute(); player.setVolume(100); } catch (err) {}
        }

        function requestUnmute() {
          wantsUnmute = true;
          unmuteHint.classList.remove('-visible');
          applyUnmuteIfWanted();
        }

        unmuteHint.classList.add('-visible');

        unmuteHint.addEventListener('click', function (e) {
          e.stopPropagation();
          requestUnmute();
        });

        // "Open in YouTube" pill - same row as the unmute pill, right-aligned.
        var youtubeLink = document.createElement('a');
        youtubeLink.className = 'last-watched-trailer-youtube';
        youtubeLink.href = 'https://www.youtube.com/watch?v=' + encodeURIComponent(key);
        youtubeLink.target = '_blank';
        youtubeLink.rel = 'noopener noreferrer';
        youtubeLink.setAttribute('aria-label', 'Open trailer in YouTube');
        youtubeLink.innerHTML =
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42 9.3-9.29H14V3zM5 5h6v2H5v12h12v-6h2v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg>' +
          '<span>Open in YouTube</span>';
        youtubeLink.addEventListener('click', function (e) { e.stopPropagation(); });
        trailerEl.appendChild(youtubeLink);

        toggleBtn.addEventListener('click', function () {
          if (!player || typeof player.getPlayerState !== 'function') return;
          var state;
          try { state = player.getPlayerState(); } catch (err) { return; }
          if (state === YT.PlayerState.PLAYING) {
            player.pauseVideo();
          } else {
            player.playVideo();
          }
        });

        // next frame so the aspect-ratio/opacity/width transitions actually animate
        requestAnimationFrame(function () {
          mediaEl.classList.add('-trailer-active');
          section.classList.add('-trailer-active');
          var labelEl = document.getElementById('last-watched-label');
          if (labelEl && lastWatched.title) {
            var titleLink = document.createElement('a');
            titleLink.className = 'last-watched-title-link';
            titleLink.href = '/show/?imdb=' + encodeURIComponent(lastWatched.imdb);
            titleLink.textContent = lastWatched.title;
            labelEl.textContent = 'Last Watch: ';
            labelEl.appendChild(titleLink);
          }
        });

        // watch for the trailer actually ending, then fade back to the poster
        loadYouTubeAPI(function () {
          if (!document.getElementById('last-watched-trailer-iframe')) return;
          player = new YT.Player('last-watched-trailer-iframe', {
            events: {
              onReady: applyUnmuteIfWanted,
              onStateChange: function (e) {
                if (e.data === YT.PlayerState.ENDED) revertToPoster();
                else if (e.data === YT.PlayerState.PLAYING) {
                  toggleBtn.classList.remove('-paused');
                  // Hard cap: revert to the poster 9s after the trailer actually starts
                  // playing (not from when we first tried to load it).
                  if (!hasStartedRevertTimer) {
                    hasStartedRevertTimer = true;
                    autoRevertTimer = setTimeout(revertToPoster, 9000);
                  }
                }
                else if (e.data === YT.PlayerState.PAUSED) toggleBtn.classList.add('-paused');
              }
            }
          });
          applyUnmuteIfWanted();
        });
      }

      function fetchTrailerKey(imdbId) {
        return fetch('https://api.themoviedb.org/3/find/' + imdbId + '?api_key=' + TMDB_API_KEY + '&external_source=imdb_id')
          .then(function (r) { return r.json(); })
          .then(function (data) {
            var hit = (data.tv_results && data.tv_results[0])
              ? { id: data.tv_results[0].id, type: 'tv' }
              : (data.movie_results && data.movie_results[0])
                ? { id: data.movie_results[0].id, type: 'movie' }
                : null;
            if (!hit) return null;
            return fetch('https://api.themoviedb.org/3/' + hit.type + '/' + hit.id + '/videos?api_key=' + TMDB_API_KEY)
              .then(function (r) { return r.json(); })
              .then(function (vdata) {
                var vids = (vdata.results || []).filter(function (v) { return v.site === 'YouTube'; });
                var pick = vids.find(function (v) { return v.type === 'Trailer' && v.official; })
                  || vids.find(function (v) { return v.type === 'Trailer'; })
                  || vids.find(function (v) { return v.type === 'Teaser'; })
                  || vids[0];
                return pick ? pick.key : null;
              });
          });
      }

      if (TMDB_API_KEY && lastWatched.imdb) {
        var startDelayTimer = new Promise(function (resolve) { setTimeout(resolve, 3500); });
        Promise.all([fetchTrailerKey(lastWatched.imdb), startDelayTimer])
          .then(function (results) { playTrailer(results[0]); })
          .catch(function () { /* no trailer found - poster just stays put */ });
      }
    })();
  </script>

  <script>
    (function () {
      var RATING_STEPS = [0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5];
      var counts = {};
      RATING_STEPS.forEach(function (r) { counts[r] = 0; });

      SHOWS.forEach(function (s) {
        if (s.rating && counts.hasOwnProperty(s.rating)) {
          counts[s.rating]++;
        }
      });

      var maxCount = Math.max.apply(null, RATING_STEPS.map(function (r) { return counts[r]; }));

      var bars = document.querySelectorAll('#ratings-bars .rbar');
      Array.prototype.forEach.call(bars, function (bar) {
        var r = parseFloat(bar.dataset.rating);
        var count = counts[r] || 0;
        var pct = maxCount > 0 ? Math.round((count / maxCount) * 100) : 0;

        bar.style.height = pct + '%';
        bar.title = r + '★ · ' + count;
      });
    })();
  </script>

  <script>
    (function () {

      var SPINNER_HTML =
        '<div class="spinner -inline"><div></div><div></div><div></div><div></div><div></div><div></div></div>';
      var PALETTE = ['#4d8eff', '#29a6ff', '#8cb2f2', '#4b84e8', '#b3c2db', '#a2acbe', '#8490a4', '#4a628c', '#405585'];
      var OTHER_COLOR = '#30405a';

      function colorFor(item, i) {
        return item.name === 'Other' ? OTHER_COLOR : PALETTE[i % PALETTE.length];
      }

      function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str || '';
        return div.innerHTML;
      }

      function fmtPct(v) {
        return (Math.round(v * 10) / 10).toString();
      }

      function buildDonut(list, centerValue, centerLabel) {
        var size = 168, cx = 84, cy = 84, r = 64, sw = 22;
        var circumference = 2 * Math.PI * r;
        var total = list.reduce(function (s, i) { return s + i.value; }, 0) || 1;
        var offset = 0;

        var segments = list.map(function (item, i) {
          var frac = item.value / total;
          var len = Math.max(frac * circumference, list.length > 1 ? 1.5 : circumference);
          var gap = list.length > 1 ? 2 : 0;
          var dasharray = Math.max(len - gap, 0) + ' ' + (circumference - len + gap);
          var dashoffset = -offset;
          offset += len;
          return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" ' +
            'stroke="' + colorFor(item, i) + '" stroke-width="' + sw + '" ' +
            'stroke-dasharray="' + dasharray + '" stroke-dashoffset="' + dashoffset + '" ' +
            'stroke-linecap="round" transform="rotate(-90 ' + cx + ' ' + cy + ')" />';
        }).join('');

        return (
          '<svg viewBox="0 0 ' + size + ' ' + size + '" class="stats-donut" role="img" aria-label="Platform distribution">' +
            '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="' + sw + '"/>' +
            segments +
            '<text x="' + cx + '" y="' + (cy - 3) + '" text-anchor="middle" class="stats-donut-center-value numbers">' + escapeHtml(centerValue) + '</text>' +
            '<text x="' + cx + '" y="' + (cy + 15) + '" text-anchor="middle" class="stats-donut-center-label">' + escapeHtml(centerLabel) + '</text>' +
          '</svg>'
        );
      }

      var statusEl = document.getElementById('embed-stats-status');
      var content = document.getElementById('embed-stats-content');
      var heroHours = document.getElementById('embed-stat-hours');
      var heroEpisodes = document.getElementById('embed-stat-episodes');
      var heroSeasons = document.getElementById('embed-stat-seasons');
      var platformMount = document.getElementById('embed-platform-donut-mount');
      var platformLegend = document.getElementById('embed-platform-legend');

      if (!statusEl || !content) return;

      statusEl.hidden = false;
      statusEl.innerHTML = SPINNER_HTML;

      var showList = STATS_YEARS[2026] || [];
      var ids = showList.map(function (s) { return s.imdb; });

      TVStats.fetchAll(ids).then(function (records) {
        var summary = TVStats.aggregate(showList, records);

        statusEl.hidden = true;
        statusEl.innerHTML = '';

        if (!summary.showCount) {
          statusEl.hidden = false;
          statusEl.innerHTML = '<p class="stats-empty">No shows logged yet.</p>';
          return;
        }

        content.hidden = false;
        heroHours.textContent = fmtPct(summary.hours);
        heroEpisodes.textContent = Math.round(summary.episodes);
        heroSeasons.textContent = Math.round(summary.seasons);

        var platformList = TVStats.toRanked(summary.platforms, 5);
        platformMount.innerHTML = buildDonut(platformList, fmtPct(summary.hours), 'HOURS');
        platformLegend.innerHTML = platformList.map(function (item, i) {
          var pct = summary.hours ? fmtPct((item.value / summary.hours) * 100) : '0';
          return (
            '<li class="stats-legend-item">' +
              '<span class="stats-legend-dot" style="background:' + colorFor(item, i) + '"></span>' +
              '<span class="stats-legend-name">' + escapeHtml(item.name) + '</span>' +
              '<span class="stats-legend-value"><span class="numbers">' + pct + '%</span></span>' +
            '</li>'
          );
        }).join('');
      }).catch(function () {
        statusEl.hidden = false;
        statusEl.classList.add('-error');
        statusEl.textContent = 'Something went wrong pulling stats.';
      });
    })();
  </script>

  <script>
    (function () {
      var form = document.getElementById('home-search-form');
      var input = document.getElementById('home-search-input');
      var overlay = document.getElementById('page-loading-overlay');

      function goToResults() {
        var value = input.value.trim();
        if (!value) return;
        overlay.classList.add('-visible');
        window.location.href = '/search/?q=' + encodeURIComponent(value);
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        goToResults();
      });

      input.addEventListener('search', function () {
        goToResults();
      });

      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.keyCode === 13) {
          e.preventDefault();
          goToResults();
        }
      });

      window.addEventListener('pageshow', function () {
        overlay.classList.remove('-visible');
      });
    })();
  </script>

  <script>
    (function () {
      var trigger = document.getElementById('avatar-trigger');
      var lightbox = document.getElementById('avatar-lightbox');
      var lightboxImg = document.getElementById('avatar-lightbox-img');

      function openLightbox() {
        lightboxImg.src = trigger.src;
        lightbox.classList.add('-visible');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        lightbox.classList.remove('-visible');
        document.body.style.overflow = '';
      }

      trigger.addEventListener('click', openLightbox);
      trigger.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openLightbox();
        }
      });

      lightbox.addEventListener('click', closeLightbox);

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeLightbox();
      });
    })();
  </script>

  <script>
    (function () {
      var wrapper = document.getElementById('backdrop');
      if (!wrapper) return;
      var image = wrapper.querySelector('.js-backdrop-image');

      var isRetina = window.devicePixelRatio > 1;
      var isMobile = window.matchMedia('(max-width: 600px)').matches;

      var url = wrapper.dataset.backdrop;
      if (isMobile && wrapper.dataset.backdropMobile) {
        url = wrapper.dataset.backdropMobile;
      } else if (isRetina && wrapper.dataset.backdrop2x) {
        url = wrapper.dataset.backdrop2x;
      }
      if (!url || url.indexOf('PASTE_') === 0) return;

      var offset = wrapper.dataset.offset;
      if (offset) {
        image.style.backgroundPosition = 'center ' + offset + '%';
      }

      var preload = new Image();
      preload.onload = function () {
        image.style.backgroundImage = 'url("' + url + '")';
        image.classList.add('is-loaded');
      };
      preload.src = url;
    })();
  </script>

  <script>
    (function () {
      var nameTrigger = document.getElementById('name-trigger');
      var circleTrigger = document.getElementById('badge-circle-trigger');
      var avatarImg = document.getElementById('avatar-trigger');
      var summary = document.querySelector('.profile-summary');
      var morph = document.getElementById('badge-morph');
      var morphAvatarImg = document.getElementById('badge-morph-avatar');
      var morphBadgeImg = document.getElementById('badge-morph-badge');
      var morphLabel = document.getElementById('badge-morph-label');
      if (!nameTrigger || !circleTrigger || !avatarImg || !summary || !morph) return;

      var isAnimating = false;

      var POP_EASE = 'cubic-bezier(0.22, 1.2, 0.36, 1)';
      var IN_EASE = 'cubic-bezier(0.45, 0, 0.55, 1)';
      var MORPH_PROPS = ['width', 'height', 'left', 'top', 'border-radius', 'border-width'];

      function setMorphTransition(duration, easing) {
        morph.style.transition = MORPH_PROPS.map(function (p) {
          return p + ' ' + duration + 'ms ' + easing;
        }).join(', ');
      }

      function playBadgeAnimation() {
        if (isAnimating) return;
        isAnimating = true;

        var summaryRect = summary.getBoundingClientRect();
        var avatarRect = avatarImg.getBoundingClientRect();

        var startLeft = avatarRect.left - summaryRect.left;
        var startTop = avatarRect.top - summaryRect.top;
        var startW = avatarRect.width;
        var startH = avatarRect.height;
        var centerY = startTop + startH / 2;
        var dot = Math.max(10, startW * 0.16);
        var dotLeft = startLeft + startW / 2 - dot / 2;
        var dotTop = centerY - dot / 2;

        morphAvatarImg.src = avatarImg.currentSrc || avatarImg.src;

        morph.style.transition = 'none';
        morph.style.left = startLeft + 'px';
        morph.style.top = startTop + 'px';
        morph.style.width = startW + 'px';
        morph.style.height = startH + 'px';
        morph.style.borderRadius = '50%';
        morph.style.borderWidth = '4px';
        morphAvatarImg.classList.add('-visible');
        morphBadgeImg.classList.remove('-visible');
        morph.classList.add('-active');
        avatarImg.style.opacity = '0';
        void morph.offsetWidth;

        var t = 0;

        requestAnimationFrame(function () {
          setMorphTransition(200, IN_EASE);
          morph.style.width = dot + 'px';
          morph.style.height = dot + 'px';
          morph.style.left = dotLeft + 'px';
          morph.style.top = dotTop + 'px';
          morph.style.borderRadius = '50%';
          morph.style.borderWidth = '2px';
        });
        t += 200;

        setTimeout(function () {
          nameTrigger.style.transition = 'opacity 0.25s ease';
          nameTrigger.style.opacity = '0';

          morphBadgeImg.classList.add('-visible');
          morphAvatarImg.classList.remove('-visible');

          var isDesktop = window.matchMedia('(min-width: 1024px)').matches;
          var badgeScale = isDesktop ? 2 : 1;
          var badgeW, badgeH;
          if (isDesktop) {
            badgeH = startH;
            var naturalAspect = (morphBadgeImg.naturalWidth && morphBadgeImg.naturalHeight)
              ? (morphBadgeImg.naturalWidth / morphBadgeImg.naturalHeight)
              : 3;
            badgeW = badgeH * naturalAspect;
          } else {
            badgeW = Math.min(summaryRect.width * 0.8, 300) * badgeScale;
            badgeH = badgeW / 3;
          }
          var badgeLeft = (summaryRect.width - badgeW) / 2;
          var badgeTop = centerY - badgeH / 2;
          var radius = Math.max(10, Math.round(badgeH * 0.16));

          setMorphTransition(360, POP_EASE);
          morph.style.width = badgeW + 'px';
          morph.style.height = badgeH + 'px';
          morph.style.left = badgeLeft + 'px';
          morph.style.top = badgeTop + 'px';
          morph.style.borderRadius = radius + 'px';
          morph.style.borderWidth = '0px';

          if (morphLabel) {
            morphLabel.style.setProperty('--badge-left', badgeLeft + 'px');
            morphLabel.style.setProperty('--badge-top', badgeTop + 'px');
            morphLabel.style.setProperty('--badge-w', badgeW + 'px');
            morphLabel.style.setProperty('--badge-h', badgeH + 'px');
            morphLabel.style.setProperty('--badge-center-y', centerY + 'px');
            morphLabel.classList.add('-visible');
          }
        }, t);
        t += 360;

        var HOLD = 950;
        t += HOLD;

        setTimeout(function () {
          morphAvatarImg.classList.add('-visible');
          morphBadgeImg.classList.remove('-visible');
          if (morphLabel) morphLabel.classList.remove('-visible');

          setMorphTransition(200, IN_EASE);
          morph.style.width = dot + 'px';
          morph.style.height = dot + 'px';
          morph.style.left = dotLeft + 'px';
          morph.style.top = dotTop + 'px';
          morph.style.borderRadius = '50%';
          morph.style.borderWidth = '2px';

          nameTrigger.style.opacity = '1';
        }, t);
        t += 200;

        setTimeout(function () {
          setMorphTransition(340, POP_EASE);
          morph.style.width = startW + 'px';
          morph.style.height = startH + 'px';
          morph.style.left = startLeft + 'px';
          morph.style.top = startTop + 'px';
          morph.style.borderRadius = '50%';
          morph.style.borderWidth = '4px';
        }, t);
        t += 340;

        setTimeout(function () {
          avatarImg.style.opacity = '1';
          morph.classList.remove('-active');
          isAnimating = false;
          circleTrigger.blur();
        }, t + 40);
      }

      circleTrigger.addEventListener('click', playBadgeAnimation);
      circleTrigger.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          playBadgeAnimation();
        }
      });
    })();
  </script>

    window.addEventListener('pageshow', function (e) {
      if (e.persisted && document.activeElement) {
        document.activeElement.blur();
      }
    });
  </script>
